<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 4.1 - SVG House</title>
</head>
<body>

  <svg width="600" height="450" viewBox="0 0 600 450">
    <!-- Sky background -->
    <rect x="0" y="0" width="600" height="450" fill="#87CEEB" />

    <!-- Sun -->
    <circle cx="500" cy="80" r="40" fill="#FFD700" />

    <!-- Ground -->
    <rect x="0" y="320" width="600" height="130" fill="#4CAF50" />

    <!-- Tree group (grouping + transform) -->
    <g transform="translate(100, 260)">
      <rect x="-8" y="40" width="16" height="60" fill="#8B4513" />
      <ellipse cx="0" cy="20" rx="45" ry="45" fill="#2E7D32" />
    </g>

    <!-- House group (grouping + transform) -->
    <g transform="translate(250, 150)">
      <!-- House body -->
      <rect x="0" y="80" width="200" height="150" fill="#A0522D" stroke="#5C3317" stroke-width="2" />

      <!-- Roof (path, triangle) -->
      <path d="M -20 80 L 100 -20 L 220 80 Z" fill="#B7410E" stroke="#5C3317" stroke-width="2" />

      <!-- Door -->
      <rect x="85" y="150" width="40" height="80" fill="#5C3317" />
      <circle cx="115" cy="190" r="3" fill="#FFD700" />

      <!-- Windows -->
      <rect x="20" y="110" width="40" height="40" fill="#B3E5FC" stroke="#5C3317" stroke-width="2" />
      <rect x="140" y="110" width="40" height="40" fill="#B3E5FC" stroke="#5C3317" stroke-width="2" />

      <!-- Path (walkway, curved) -->
      <path d="M 100 230 Q 90 280 60 320" stroke="#DDD" stroke-width="20" fill="none" />
    </g>

    <!-- Label text -->
    <text x="470" y="250" font-family="Arial" font-size="20" fill="#000000">House</text>
  </svg>

</body>
</html>
